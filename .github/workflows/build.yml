name: Android APK

# Builds the APK and, on every push to main, publishes a signed release APK as a GitHub Release
# tagged `android-b<N>` (N = versionCode = run number). The installed app checks these releases
# and offers one-tap updates. Pull requests only run the tests and a test build (not released).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      notes:
        description: "Release notes (optional, first line is shown in the app)"
        required: false

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  APP_BUILD_NUMBER: ${{ github.run_number }}

jobs:
  apk:
    name: Build & release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check signing secrets
        id: signing
        env:
          KS: ${{ secrets.DRAWIFY_KEYSTORE_BASE64 }}
          PW: ${{ secrets.DRAWIFY_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS" ] && [ -n "$PW" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "::warning::No signing secrets - PR test build only (debug key, not released)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Missing DRAWIFY_KEYSTORE_BASE64 / DRAWIFY_KEYSTORE_PASSWORD secrets. Run scripts/setup-signing.sh once (see README)."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testReleaseUnitTest --no-daemon

      - name: Decode keystore
        if: steps.signing.outputs.ready == 'true'
        env:
          KS: ${{ secrets.DRAWIFY_KEYSTORE_BASE64 }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/drawify-release.jks"
          echo "DRAWIFY_KEYSTORE_PATH=$RUNNER_TEMP/drawify-release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          DRAWIFY_KEYSTORE_PASSWORD: ${{ secrets.DRAWIFY_KEYSTORE_PASSWORD }}
          DRAWIFY_KEY_PASSWORD: ${{ secrets.DRAWIFY_KEYSTORE_PASSWORD }}
          DRAWIFY_KEY_ALIAS: drawify
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | head -5
          cp "$APK" drawify.apk
          ls -la drawify.apk

      - name: Upload test APK (PR)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: drawify-pr-apk
          path: drawify.apk
          retention-days: 7

      - name: Publish GitHub release
        if: github.event_name != 'pull_request' && steps.signing.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_INPUT: ${{ github.event.inputs.notes }}
        run: |
          TAG="android-b${APP_BUILD_NUMBER}"
          NOTES="${NOTES_INPUT:-$(git log -1 --pretty=%s)}"
          gh release create "$TAG" drawify.apk \
            --title "Drawify Android · build ${APP_BUILD_NUMBER}" \
            --notes "$NOTES" \
            --target "$GITHUB_SHA"
