name: Build APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk drawify-1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: drawify-apk
          path: drawify-*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Drawify 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: drawify-*.apk
          body: |
            Preuzmi `drawify-1.0.${{ github.run_number }}.apk` ispod i instaliraj na telefon.
            Build sa grane `${{ github.ref_name }}` (commit ${{ github.sha }}).
